<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="space-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a105c" />
      <stop offset="70%" stop-color="#0f0525" />
      <stop offset="100%" stop-color="#060212" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2" />
      <stop offset="50%" stop-color="#f5ce68" />
      <stop offset="100%" stop-color="#cf9428" />
    </linearGradient>
    <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d4cf5" />
      <stop offset="50%" stop-color="#5522aa" />
      <stop offset="100%" stop-color="#2c0c66" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="192" height="192" rx="42" fill="url(#space-glow)" />

  <!-- Outer celestial ring -->
  <circle cx="96" cy="96" r="78" fill="none" stroke="rgba(180, 120, 255, 0.25)" stroke-width="1.5" />
  <circle cx="96" cy="96" r="70" fill="none" stroke="rgba(245, 206, 104, 0.35)" stroke-width="2" stroke-dasharray="3 4" />

  <!-- Day hemisphere (Gold) -->
  <path d="M96,26 A70,70 0 0,1 96,166 A35,35 0 0,1 96,96 A35,35 0 0,0 96,26" fill="url(#gold-grad)" />

  <!-- Night hemisphere (Violet) -->
  <path d="M96,26 A70,70 0 0,0 96,166 A35,35 0 0,0 96,96 A35,35 0 0,1 96,26" fill="url(#violet-grad)" />

  <!-- Celestial pearls -->
  <circle cx="96" cy="61" r="11" fill="#0c0422" filter="url(#glow)" />
  <circle cx="96" cy="61" r="6" fill="#7535dc" />

  <circle cx="96" cy="131" r="11" fill="#ffffff" filter="url(#glow)" />
  <circle cx="96" cy="131" r="6" fill="#f8d672" />

  <!-- Center threshold ripple -->
  <circle cx="96" cy="96" r="4" fill="#ffffff" filter="url(#glow)" />
</svg>
