<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="space-glow-512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2c1160" />
      <stop offset="65%" stop-color="#100528" />
      <stop offset="100%" stop-color="#050110" />
    </radialGradient>
    <linearGradient id="gold-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4be" />
      <stop offset="50%" stop-color="#f8d374" />
      <stop offset="100%" stop-color="#c98f24" />
    </linearGradient>
    <linearGradient id="violet-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9957ff" />
      <stop offset="50%" stop-color="#5824b2" />
      <stop offset="100%" stop-color="#290a61" />
    </linearGradient>
    <filter id="glow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#space-glow-512)" />

  <!-- Outer celestial rings and orbit lines -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="rgba(180, 120, 255, 0.22)" stroke-width="3" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(248, 211, 116, 0.35)" stroke-width="4" stroke-dasharray="8 10" />

  <!-- Day hemisphere (Gold) -->
  <path d="M256,66 A190,190 0 0,1 256,446 A95,95 0 0,1 256,256 A95,95 0 0,0 256,66" fill="url(#gold-grad-512)" />

  <!-- Night hemisphere (Violet) -->
  <path d="M256,66 A190,190 0 0,0 256,446 A95,95 0 0,0 256,256 A95,95 0 0,1 256,66" fill="url(#violet-grad-512)" />

  <!-- Celestial pearls -->
  <circle cx="256" cy="161" r="28" fill="#0b0320" filter="url(#glow-512)" />
  <circle cx="256" cy="161" r="15" fill="#843ef2" />

  <circle cx="256" cy="351" r="28" fill="#ffffff" filter="url(#glow-512)" />
  <circle cx="256" cy="351" r="15" fill="#fedc7d" />

  <!-- Threshold center node -->
  <circle cx="256" cy="256" r="9" fill="#ffffff" filter="url(#glow-512)" />
</svg>
